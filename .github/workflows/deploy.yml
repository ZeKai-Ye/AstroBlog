name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Lets you re-run a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed by the Pages deploy.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. `cancel-in-progress: false` lets a running deploy finish
# rather than leaving the Pages site half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Resolves the Pages origin and sub-path. For a project repo this is
      # https://<user>.github.io + /<repo>; for a custom domain it is the domain
      # and an empty base. Feeding these into the build is what makes the
      # canonical URL and every internal link come out right.
      #
      # `enablement: true` lets the first run turn Pages on by itself
      # (Pages build type → "GitHub Actions"); without it the step fails with
      # "Get Pages site failed" on a repo where Pages was never enabled.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
